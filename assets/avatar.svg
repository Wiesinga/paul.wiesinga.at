<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="100" fill="url(#bgGrad)" />
  <circle cx="100" cy="100" r="96" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 4" />

  <!-- Abstract Silhouette / Tech Avatar -->
  <g filter="url(#glow)" opacity="0.9">
    <!-- Head -->
    <circle cx="100" cy="78" r="32" fill="#cbd5e1" />
    <!-- Shoulders -->
    <path d="M42 168 C 42 125, 70 120, 100 120 C 130 120, 158 125, 158 168 Z" fill="#94a3b8" />
  </g>

  <!-- Monogram Accent Badge -->
  <circle cx="146" cy="146" r="22" fill="#0f172a" stroke="url(#accent)" stroke-width="2.5" />
  <text x="146" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="url(#accent)" text-anchor="middle">PW</text>
</svg>
